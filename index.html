<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whoami | @bluezex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-container">
        <div class="bg-gradient"></div>
    </div>

    <div id="enter-screen" class="enter-screen">
        <div class="terminal-loader">
            <div id="terminal-text" class="terminal-text"></div>
        </div>
    </div>

    <main class="main-content" style="opacity: 0; pointer-events: none;">
        <div class="profile-layout">

            <div class="profile-header-horizontal">
                <div class="avatar-container">
                    <img id="lanyard-avatar"
                        src="https://cdn.discordapp.com/avatars/773408954352009216/865fc138a9e742a2f2d7e9b154144717.png"
                        alt="Avatar" class="avatar">
                    <div id="lanyard-status" class="status-indicator offline"></div>
                </div>

                <div class="profile-info">
                    <div class="username-container">
                        <h1 class="username">
                            <span id="lanyard-username" class="sparkle-text">Loading...</span>
                        </h1>

                        <div id="clan-tag-pill" class="clan-tag-pill" style="display: none;">
                            <img id="clan-badge-icon" src="" alt="Clan Badge">
                            <span id="clan-tag-text"></span>
                        </div>

                        <div class="discord-badges" id="discord-badges">
                            <!-- Injected via JS -->
                        </div>
                    </div>

                    <p id="typewriter" class="bio"></p>
                    <p id="lanyard-activity" class="subtext">Menghubungkan ke Discord...</p>
                </div>
            </div>

            <div id="activity-player" class="activity-player" data-tilt data-tilt-max="5" data-tilt-speed="400"
                data-tilt-glare="true" data-tilt-max-glare="0.2" style="display: none;">
                <div class="activity-header">
                    <i id="activity-icon" class="ph-fill ph-spotify-logo"></i>
                    <span id="activity-title">Listening to Spotify</span>
                </div>
                <div class="activity-content">
                    <img id="activity-cover" src="" alt="Activity Cover" class="activity-cover">
                    <div class="activity-info">
                        <div id="activity-name" class="activity-name">Activity Name</div>
                        <div id="activity-details" class="activity-details">Details</div>
                        <div id="activity-state" class="activity-state">State</div>
                        <div id="activity-progress-container" class="activity-progress-container">
                            <div id="activity-progress-bar" class="activity-progress-bar"></div>
                        </div>
                        <div id="activity-time" class="activity-time">
                            <span id="activity-time-current">0:00</span>
                            <span id="activity-time-total">0:00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="social-links-flat">
                <a href="https://me.sfht.space" target="_blank" class="social-btn-flat" title="Website"><i
                        class="ph ph-globe"></i></a>
                <a href="https://github.com/JustSEMI" target="_blank" class="social-btn-flat" title="Github"><i
                        class="ph-fill ph-github-logo"></i></a>
                <a href="http://discordapp.com/users/773408954352009216" target="_blank" class="social-btn-flat"
                    title="Discord"><i class="ph-fill ph-discord-logo"></i></a>
                <a href="https://steamcommunity.com/profiles/76561199162257006/" target="_blank" class="social-btn-flat"
                    title="Steam"><i class="ph-fill ph-steam-logo"></i></a>
                <a href="https://open.spotify.com/user/312x2wjkk2yqzmli5pal3xhfdlwu" target="_blank"
                    class="social-btn-flat" title="Spotify"><i class="ph-fill ph-spotify-logo"></i></a>
                <a href="#" target="_blank" class="social-btn-flat" title="Instagram"><i
                        class="ph-fill ph-instagram-logo"></i></a>
                <a href="#" target="_blank" class="social-btn-flat" title="TikTok"><i
                        class="ph-fill ph-tiktok-logo"></i></a>
            </div>
            <div class="view-counter-flat">
                <i class="ph-fill ph-eye"></i> <span id="view-count">...</span> Views
            </div>

            <div class="local-player-flat" data-tilt data-tilt-max="5" data-tilt-speed="400" data-tilt-glare="true"
                data-tilt-max-glare="0.1">
                <div class="local-player-controls">
                    <button id="prev-btn" class="play-btn" title="Previous">
                        <i class="ph-fill ph-skip-back"></i>
                    </button>
                    <button id="play-pause-btn" class="play-btn" title="Play/Pause">
                        <i class="ph-fill ph-play"></i>
                    </button>
                    <button id="next-btn" class="play-btn" title="Next">
                        <i class="ph-fill ph-skip-forward"></i>
                    </button>
                </div>
                <img id="local-song-cover" src="" alt="Cover" class="local-song-cover" style="display: none;">
                <div class="local-player-info">
                    <div id="local-song-title" class="local-song-title">Background Music</div>
                    <div id="local-song-artist" class="local-song-artist" style="display: none;">Unknown Artist</div>
                    <div class="local-progress-container" id="local-progress-container">
                        <div class="local-progress-bar" id="local-progress-bar"></div>
                    </div>
                </div>

                <div class="visualizer-time-wrapper">
                    <div id="audio-visualizer" class="audio-visualizer">
                        <!-- Injected via JS -->
                    </div>
                    <div class="local-time" id="local-time">0:00</div>
                </div>
            </div>
        </div>
        <div class="location-pin">
            <i class="ph-fill ph-map-pin"></i> <span>Indonesia, Java</span>
        </div>

        <div class="volume-container">
            <button id="mute-btn" class="mute-btn" title="Mute/Unmute">
                <i class="ph-fill ph-speaker-high"></i>
            </button>
            <div class="volume-slider-wrapper">
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
    </main>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="assets/config.js"></script>
    <script src="script.js"></script>
</body>

</html>
